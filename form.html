<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario candidatura a vaga</title>
</head>
<body>
    <header></header>
    <h1>Formulario de candidatura a Vaga</h3>

<form action="">

    <label for="Nome"> Nome Completo:</label>
    <input type="text" id="nome" name="Nome" required> <br>


    <label for="Email">Email: </label>
    <input type="email" id="email" name="Email" required> <br>


    <label for="Idade">Idade: </label>
    <input type="number" id="idade" name="idade" required>> <br>


    <label for="Para qual materia está se candidatando"> Para qual materia esta se candidatanto:</label><br>
    <select name="Materia" id="materia" required><br>
        <option value="Matematica"> Matematica</option>
        <option value="Portugues">Portugues</option>
        <option value="Biologia">Biologia</option>
        <option value="Ciencias">Ciencias</option>
        <option value="Historia">Historia</option>
        <option value="Geografia">Geografia</option>
        <option value="Artes">Artes</option>
    </select><br>


    <label for="Nivel de escolaridade">Qual o seu nivel de escolaridade: </label><br>
    <select name="nivel de escolaridade" id="escolaridade" required> <br>
        <option value="superior completo"> Superior Completo</option>
        <option value="cursando Mestrado"> Cursando Mestrado</option>
        <option value="mestrado completo"> Mestrado Completo</option>
        <option value="cursando doutorado"> Cursando Doutorado</option>
        <option value="doutorado completo"> Doutorado Completo</option>
    </select><br>

    
    <label for="Descrição sobre si mesmo">Faça uma descrição de si mesmo: </label> <br>
        <textarea name="descricao sobre si mesmo" id="descricao" cols="30" rows="10" maxlength="200"
            required></textarea><br>




</form>
</body>
</html>
